name: offlinepay
description: "OfflinePay - An offline-first digital payment prototype mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.0

  # Local persistence (Offline-first)
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Cryptography & Identifiers
  crypto: ^3.0.3
  uuid: ^4.3.3

  # QR Code support (Phase 2)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # UI & Date formatting
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
